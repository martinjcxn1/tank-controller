name: Build & Release Firmware

# Fully automated releases. Merge firmware changes to main and this workflow
# generates a UTC-timestamp version, injects it into the firmware, builds, and —
# only if the binary actually changed — publishes it.
#
# Devices fetch from GitHub PAGES, not Releases: release download URLs redirect
# to a ~930-byte signed URL that breaks ESPHome's http_request OTA client
# (issue #13786). Pages serves the manifest + binary from short, direct URLs, so
# both the update check AND the firmware download work. A GitHub Release is still
# published alongside for humans, the factory image, and rollback.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions". Without that, the deploy step fails.

on:
  push:
    branches:
      - main
    paths:
      - "tankcontroller.yaml"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write     # create the GitHub Release
  pages: write        # deploy to GitHub Pages
  id-token: write     # required by actions/deploy-pages

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VER="$(date -u +%Y.%m.%d.%H%M)"
          echo "clean=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VER}"

      - name: Inject version into firmware
        run: |
          set -euo pipefail
          sed -i 's/version: "0.0.0-dev".*/version: "${{ steps.version.outputs.clean }}"/' tankcontroller.yaml
          grep -n 'version:' tankcontroller.yaml | grep "${{ steps.version.outputs.clean }}"

      - name: Build firmware
        uses: esphome/build-action@v6
        id: esphome
        with:
          yaml-file: tankcontroller.yaml
          version: 2026.7.3

      - name: Collect binaries + compute md5
        id: bin
        run: |
          set -euo pipefail
          mkdir -p site release
          OTA_BIN="$(find "${{ steps.esphome.outputs.name }}" -name '*.ota.bin' | head -1)"
          FACTORY_BIN="$(find "${{ steps.esphome.outputs.name }}" -name '*.factory.bin' | head -1 || true)"
          # site/ = what devices fetch (Pages).  release/ = human-facing Release.
          cp "$OTA_BIN" site/tankcontroller.ota.bin
          cp "$OTA_BIN" release/tankcontroller.ota.bin
          [ -n "${FACTORY_BIN:-}" ] && cp "$FACTORY_BIN" release/tankcontroller.factory.bin || true
          MD5="$(md5sum site/tankcontroller.ota.bin | awk '{print $1}')"
          echo "md5=${MD5}" >> "$GITHUB_OUTPUT"
          echo "New binary md5: ${MD5}"

      # Compare against the md5 in the currently-published Pages manifest. If the
      # binary is byte-identical, there's nothing to ship. (First run: no Pages
      # yet -> PREV empty -> treated as changed.)
      - name: Has the binary changed?
        id: changed
        run: |
          set -euo pipefail
          PREV="$(curl -fsSL "https://martinjcxn1.github.io/tank-controller/manifest.json" \
                    | python3 -c 'import sys,json; print(json.load(sys.stdin)["builds"][0]["ota"]["md5"])' 2>/dev/null || true)"
          echo "Previous md5: ${PREV:-<none>}"
          if [ "${PREV:-}" = "${{ steps.bin.outputs.md5 }}" ]; then
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "Binary unchanged — nothing to release."
          else
            echo "ship=true" >> "$GITHUB_OUTPUT"
            echo "Binary changed — releasing."
          fi

      # manifest.json 'path' is resolved relative to the manifest URL, so on Pages
      # it points at https://martinjcxn1.github.io/tank-controller/tankcontroller.ota.bin
      # — short and direct, no redirect.
      - name: Build manifest
        if: steps.changed.outputs.ship == 'true'
        run: |
          set -euo pipefail
          VER_CLEAN="${{ steps.version.outputs.clean }}"
          cat > site/manifest.json <<EOF
          {
            "name": "Tank Controller",
            "version": "${VER_CLEAN}",
            "home_assistant_domain": "esphome",
            "new_install_prompt_erase": false,
            "builds": [
              {
                "chipFamily": "ESP32",
                "ota": {
                  "path": "tankcontroller.ota.bin",
                  "md5": "${{ steps.bin.outputs.md5 }}",
                  "summary": "Tank Controller ${VER_CLEAN}",
                  "release_url": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
                }
              }
            ]
          }
          EOF
          cp site/manifest.json release/manifest.json
          cat site/manifest.json

      - name: Publish GitHub Release
        if: steps.changed.outputs.ship == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: release/*

      - name: Setup Pages
        if: steps.changed.outputs.ship == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changed.outputs.ship == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.changed.outputs.ship == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
