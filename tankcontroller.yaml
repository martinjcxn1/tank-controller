#    pin: {mcp23xxx: lid_buttons, number: 8, mode: {input: true, pullup: true}, inverted: true}
#    filters: [delayed_on: 10ms]
#  - platform: gpio
#    name: button9
#    internal: true
#    pin: {mcp23xxx: lid_buttons, number: 9, mode: {input: true, pullup: true}, inverted: true}
#    filters: [delayed_on: 10ms]
#  - platform: gpio
#    name: button10
#    internal: true
#    pin: {mcp23xxx: lid_buttons, number: 10, mode: {input: true, pullup: true}, inverted: true}
#    filters: [delayed_on: 10ms]
#  - platform: gpio
#    name: button11
#    internal: true
#    pin: {mcp23xxx: lid_buttons, number: 11, mode: {input: true, pullup: true}, inverted: true}
#    filters: [delayed_on: 10ms]
#  - platform: gpio
#    name: button12
#    internal: true
#    pin: {mcp23xxx: lid_buttons, number: 12, mode: {input: true, pullup: true}, inverted: true}
#    filters: [delayed_on: 10ms]
#  - platform: gpio
#    name: button13
#    internal: true
#    pin: {mcp23xxx: lid_buttons, number: 13, mode: {input: true, pullup: true}, inverted: true}
#    filters: [delayed_on: 10ms]
#  - platform: gpio
#    name: button14
#    internal: true
#    pin: {mcp23xxx: lid_buttons, number: 14, mode: {input: true, pullup: true}, inverted: true}
#    filters: [delayed_on: 10ms]
  - platform: gpio
    pin: GPIO25
    id: leak_sensor
    name: "Leak Detector"
    web_server: {sorting_group_id: grp_status, sorting_weight: 40}
    device_class: moisture
    # Debounce: require 200ms of leak before acting (kills spikes), and 2s clear
    # before releasing so a flickering leak doesn't rapidly toggle the WC stop.
    filters:
      - delayed_on: 200ms
      - delayed_off: 2s
  # Raw float pins keep their as-wired polarity (used by the control logic) and
  # are hidden from the web; the "_display" copies below are what's shown.
  - platform: gpio
    pin: GPIO36
    id: float_1
    internal: true
    device_class: moisture
    filters:
      - delayed_on: 500ms
      - delayed_off: 500ms
  - platform: gpio
    pin: GPIO39
    id: float_2
    internal: true
    device_class: moisture
    filters:
      - delayed_on: 500ms
      - delayed_off: 500ms
  # Web display copies. Max/top roles show inverted, so "at the level" reads
  # Wet/On even though those sensors are wired OFF-when-reached.
  - platform: template
    id: float_1_display
    name: "Float 1"
    device_class: moisture
    web_server: {sorting_group_id: grp_status, sorting_weight: 50}
    lambda: |-
      // ATO Full is a max sensor (raw OFF = at level) → invert for display.
      if (id(float_1_role).current_option() == "ATO Full") return !id(float_1).state;
      // Empty roles (Reservoir Empty / ATO Empty) read raw ON when below → as-is.
      return id(float_1).state;
  - platform: template
    id: float_2_display
    name: "Float 2"
    device_class: moisture
    web_server: {sorting_group_id: grp_status, sorting_weight: 60}
    lambda: |-
      // All Float 2 roles are max sensors (raw OFF = at level) → invert for display.
      return !id(float_2).state;
  - platform: gpio
    pin: GPIO34
    id: water_level
    internal: true
    device_class: moisture
    # Debounce both edges so ripples/splashing can't briefly read "full" and end
    # a fill early, or "dry" and kick the ATO. 500ms stable either way.
    filters:
      - delayed_on: 500ms
      - delayed_off: 500ms
  - platform: template
    id: water_level_display
    name: "Water Level"
    device_class: moisture
    web_server: {sorting_group_id: grp_status, sorting_weight: 70}
    lambda: |-
      // Top sensor (raw OFF = at level/full) → invert so "full" reads Wet/On.
      return !id(water_level).state;
sensor:
  # RAM diagnostics for the OTA/TLS handshake. "Largest Free Block" is the number
  # that matters: TLS needs one big contiguous allocation, so a fragmented heap
  # can fail even with lots of total free RAM. If this dips near/below the TLS
  # need (~40KB) when you press Install, heap is the cause of the update failure.
  - platform: template
    name: "Free Heap"
    id: free_heap
    unit_of_measurement: "B"
    accuracy_decimals: 0
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 40}
    update_interval: 5s
    lambda: 'return (float) esp_get_free_heap_size();'
  - platform: template
    name: "Largest Free Block"
    id: largest_free_block
    unit_of_measurement: "B"
    accuracy_decimals: 0
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 45}
    update_interval: 5s
    lambda: 'return (float) heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);'
  - platform: dallas_temp
    name: "Tank Temperature"
    id: tank_temperature
    web_server: {sorting_group_id: grp_status, sorting_weight: 10}
    update_interval: 30s
    filters:
      - filter_out: nan
  - platform: hx711
    id: co2_raw
    name: "CO2 Raw"
    internal: true
    dout_pin: GPIO33
    clk_pin: GPIO32
    gain: 128
    update_interval: 1s
    filters:
      - median:
          window_size: 8
          send_every: 4
  - platform: template
    id: co2_weight
    name: "CO2 Weight"
    web_server: {sorting_group_id: grp_calibration, sorting_weight: 10}
    unit_of_measurement: g
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float raw = id(co2_raw).state;
      if (isnan(raw)) return NAN;
      return (raw - id(hx_offset)) / id(hx_scale);
  # Read-only: max fill time = fill_ratio * drain_seconds * 1.1 (flood safety cap)
  - platform: template
    id: wc_max_fill_time
    name: "Water Change Max Fill Time"
    web_server: {sorting_group_id: grp_wc_settings, sorting_weight: 60}
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float R = id(wc_fill_ratio).state;
      float margin = (R < 1.0f) ? 1.0f : 1.1f;   // drop 1.1 safety when fill is faster than drain
      return R * id(wc_drain_seconds).state * margin;
text_sensor:
  # Running firmware version. This is the CI-injected project.version baked into
  # the binary — the same value the update entity compares against the manifest.
  # Shows "0.0.0-dev" on local/USB dev builds.
  - platform: template
    name: "Firmware Version"
    id: fw_version
    icon: "mdi:chip"
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 10}
    update_interval: never
    lambda: 'return {ESPHOME_PROJECT_VERSION};'
  # Current ESP date/time (from system clock; SNTP or the DS3231 RTC).
  - platform: template
    name: "Date / Time"
    id: esp_datetime
    web_server: {sorting_group_id: grp_status, sorting_weight: 5}
    update_interval: 1s
    lambda: |-
      auto t = id(sntp_time).now();
      if (!t.is_valid()) return std::string("no time");
      return t.strftime("%Y-%m-%d %H:%M:%S");
  # ---- Doser name headings ----
  # Shows that doser's DC label at the top of its group. For channels that share
  # the output with another function, the name only appears when the channel is
  # actually set to Doser — otherwise the group reads "Not in Use".
  - platform: template
    name: "Doser 3 Name"
    id: doser_3_name
    web_server: {sorting_group_id: grp_doser3, sorting_weight: 5}
    update_interval: 5s
    lambda: 'return id(dc_3_label).state;'
  - platform: template
    name: "Doser 4 Name"
    id: doser_4_name
    web_server: {sorting_group_id: grp_doser4, sorting_weight: 5}
    update_interval: 5s
    lambda: |-
      if (id(dc_4_role).current_option() != "Doser") return std::string("Not in Use");
      return id(dc_4_label).state;
  - platform: template
    name: "Doser 5 Name"
    id: doser_5_name
    web_server: {sorting_group_id: grp_doser5, sorting_weight: 5}
    update_interval: 5s
    lambda: |-
      if (id(dc_5_role).current_option() != "Doser") return std::string("Not in Use");
      return id(dc_5_label).state;
  - platform: template
    name: "Doser 6 Name"
    id: doser_6_name
    web_server: {sorting_group_id: grp_doser6, sorting_weight: 5}
    update_interval: 5s
    lambda: |-
      if (id(dc_6_role).current_option() != "Doser") return std::string("Not in Use");
      return id(dc_6_label).state;
  - platform: template
    name: "Doser 7 Name"
    id: doser_7_name
    web_server: {sorting_group_id: grp_doser7, sorting_weight: 5}
    update_interval: 5s
    lambda: |-
      if (id(dc_7_role).current_option() != "Doser") return std::string("Not in Use");
      return id(dc_7_label).state;
  - platform: template
    name: "Doser 8 Name"
    id: doser_8_name
    web_server: {sorting_group_id: grp_doser8, sorting_weight: 5}
    update_interval: 5s
    lambda: |-
      if (id(dc_8_role).current_option() != "Doser") return std::string("Not in Use");
      return id(dc_8_label).state;
  # Each float's assigned role, shown directly above that float's status so the
  # reading is readable without cross-referencing the Settings section.
  - platform: template
    name: "Float 1 Role"
    id: float_1_role_display
    web_server: {sorting_group_id: grp_status, sorting_weight: 49}
    update_interval: 5s
    lambda: 'return id(float_1_role).current_option();'
  - platform: template
    name: "Float 2 Role"
    id: float_2_role_display
    web_server: {sorting_group_id: grp_status, sorting_weight: 59}
    update_interval: 5s
    lambda: 'return id(float_2_role).current_option();'
  # Current water-change phase, why it's paused, and how long each phase has left.
  - platform: template
    name: "Water Change Status"
    id: wc_status
    web_server: {sorting_group_id: grp_wc_settings, sorting_weight: 30}
    update_interval: 2s
    lambda: |-
      char buf[72];
      if (!id(wc_active)) return std::string("idle");
      if (id(wc_paused)) {
        if (id(leak_sensor).state) return std::string("paused: leak detected");
        if (id(float_1_role).current_option() == "Reservoir Empty" && id(float_1).state)
          return std::string("paused: reservoir empty (float 1)");
        if (id(float_2_role).current_option() == "Drainage Full" && !id(float_2).state)
          return std::string("paused: drainage full (float 2)");
        return std::string("paused by user — press Continue");
      }
      float R = id(wc_fill_ratio).state;
      float D = id(wc_drain_seconds).state;
      bool sim = id(wc_simultaneous).state;
      if (!id(wc_drain_done)) {
        snprintf(buf, sizeof(buf), "draining: %d / %d s", (int) id(wc_drain_elapsed), (int) D);
        return std::string(buf);
      }
      if (!id(wc_fill_started)) {
        if (sim && !id(wc_clear_seen)) return std::string("waiting for level to clear");
        float delayS = sim ? ((R > 1.0f) ? 10.0f : (D * (1.0f - R))) : 0.0f;
        int rem = (int) (delayS - id(wc_delay_elapsed));
        if (rem < 0) rem = 0;
        snprintf(buf, sizeof(buf), "waiting to fill: %d s left", rem);
        return std::string(buf);
      }
      if (!id(wc_fill_done)) {
        float maxf = R * D * ((R < 1.0f) ? 1.0f : 1.1f);
        snprintf(buf, sizeof(buf), "filling: %d / %d s%s", (int) id(wc_fill_elapsed),
                 (int) maxf, id(wc_fill_force) ? " (timed, no level stop)" : "");
        return std::string(buf);
      }
      return std::string("finishing");
  # Why the ATO is or isn't running — checks the same conditions, in the same
  # order, as the ATO block in the control loop.
  - platform: template
    name: "ATO Status"
    id: ato_status
    web_server: {sorting_group_id: grp_ato, sorting_weight: 40}
    update_interval: 2s
    lambda: |-
      switch (id(ato_reason)) {
        case 0: return std::string("topping up");
        case 1: return std::string("idle: DC7 not in ATO role");
        case 2: return std::string("blocked: water change active");
        case 3: return std::string("blocked: leak detected");
        case 4: return std::string("blocked: water level failsafe (float 2)");
        case 5: return std::string("blocked: ATO source empty (float 1)");
        case 6: return std::string("stopped by user");
        case 7: return std::string("idle: tank full");
        case 8: return std::string("idle: ATO disabled");
        case 9: return std::string("stopped: max runtime reached");
      }
      return std::string("starting up");
climate:
  # Native thermostat: owns the heat/cool setpoints + mode and provides the
  # climate card / HA entity. The actual output switching is done by the 1s loop
  # (so the adjustable Temperature Deadband and per-channel roles still apply);
  # these actions only drive the card's action indicator via native hysteresis.
  - platform: thermostat
    name: "Tank Thermostat"
    id: tank_thermostat
    sensor: tank_temperature
    web_server: {sorting_group_id: grp_temp, sorting_weight: 1}
    visual:
      min_temperature: 15 °C
      max_temperature: 35 °C
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
    min_idle_time: 30s
    min_heating_off_time: 30s
    min_heating_run_time: 30s
    min_cooling_off_time: 30s
    min_cooling_run_time: 30s
    heat_deadband: 0.3
    heat_overrun: 0.3
    cool_deadband: 0.3
    cool_overrun: 0.3
    preset:
      - name: Home
        mode: heat_cool
        default_target_temperature_low: 25.0
        default_target_temperature_high: 28.0
    default_preset: Home
    heat_action:
      - lambda: 'id(heat_on) = true; id(cool_on) = false;'
    cool_action:
      - lambda: 'id(cool_on) = true; id(heat_on) = false;'
    idle_action:
      - lambda: 'id(heat_on) = false; id(cool_on) = false;'
    # Enable the dual-setpoint Heat/Cool mode in the selector (needs both actions).
    heat_cool_mode: true
interval:
  - interval: 750ms
    then:
      - switch.toggle: heartbeat_pin
  # ---- AC + DC role control ----
  - interval: 1s
    then:
      - lambda: |-
          auto in_window = [](int on_h, int on_m, int off_h, int off_m) -> bool {
            auto now = id(sntp_time).now();
            if (!now.is_valid()) return false;
            int cur = now.hour * 60 + now.minute;
            int on  = on_h * 60 + on_m;
            int off = off_h * 60 + off_m;
            if (on <= off) return cur >= on && cur < off;
            else return cur >= on || cur < off;
          };
          // The thermostat (climate entity) sets heat_on / cool_on via its heat,
          // cool and idle actions, using its native 0.3 deadband. The loop just
          // applies those flags to the dynamic outputs below. Safety net: if the
          // temperature reading is invalid, force both off regardless.
          if (isnan(id(tank_temperature).state)) {
            id(heat_on) = false;
            id(cool_on) = false;
          }
          // ===== AC channels =====
          {
            std::string m = id(ac_1_mode).current_option();
            if (m == "Off") id(AC_1).turn_off();
            else if (m == "Always On") id(AC_1).turn_on();
            else if (m == "Scheduled") {
              auto on = id(ac_1_on_time).state_as_esptime();
              auto off = id(ac_1_off_time).state_as_esptime();
              if (in_window(on.hour, on.minute, off.hour, off.minute)) id(AC_1).turn_on();
              else id(AC_1).turn_off();
            }
            else if (m == "Heater") {
              if (id(heat_on)) id(AC_1).turn_on(); else id(AC_1).turn_off();
            }
          }
          {
            std::string m = id(ac_2_mode).current_option();
            if (m == "Off") id(AC_2).turn_off();
            else if (m == "Always On") id(AC_2).turn_on();
            else if (m == "Scheduled") {
              auto on = id(ac_2_on_time).state_as_esptime();
              auto off = id(ac_2_off_time).state_as_esptime();
              if (in_window(on.hour, on.minute, off.hour, off.minute)) id(AC_2).turn_on();
              else id(AC_2).turn_off();
            }
            else if (m == "Heater") {
              if (id(heat_on)) id(AC_2).turn_on(); else id(AC_2).turn_off();
            }
          }
          {
            std::string m = id(ac_3_mode).current_option();
            if (m == "Off") id(AC_3).turn_off();
            else if (m == "Always On") id(AC_3).turn_on();
            else if (m == "Scheduled") {
              auto on = id(ac_3_on_time).state_as_esptime();
              auto off = id(ac_3_off_time).state_as_esptime();
              if (in_window(on.hour, on.minute, off.hour, off.minute)) id(AC_3).turn_on();
              else id(AC_3).turn_off();
            }
            else if (m == "Heater") {
              if (id(heat_on)) id(AC_3).turn_on(); else id(AC_3).turn_off();
            }
          }
          {
            std::string m = id(ac_4_mode).current_option();
            if (m == "Off") id(AC_4).turn_off();
            else if (m == "Always On") id(AC_4).turn_on();
            else if (m == "Scheduled") {
              auto on = id(ac_4_on_time).state_as_esptime();
              auto off = id(ac_4_off_time).state_as_esptime();
              if (in_window(on.hour, on.minute, off.hour, off.minute)) id(AC_4).turn_on();
              else id(AC_4).turn_off();
            }
            else if (m == "Heater") {
              if (id(heat_on)) id(AC_4).turn_on(); else id(AC_4).turn_off();
            }
          }
          // ===== DC 5–8 role dispatch =====
          auto now = id(sntp_time).now();
          bool time_ok = now.is_valid();
          bool leak = id(leak_sensor).state;   // ON = leak detected
          // ----- Float sensor role conditions -----
          // Polarity: EMPTY-type sensors read ON when water drops BELOW the level
          // (triggered = ON). FULL/MAX-type sensors read OFF when water REACHES the
          // level (triggered = OFF), same convention as the main water_level sensor.
          std::string f1role = id(float_1_role).current_option();
          std::string f2role = id(float_2_role).current_option();
          bool reservoir_empty = (f1role == "Reservoir Empty" && id(float_1).state);    // empty: ON = below
          bool ato_empty       = (f1role == "ATO Empty"       && id(float_1).state);    // empty: ON = below
          bool drainage_full   = (f2role == "Drainage Full"   && !id(float_2).state);   // full: OFF = reached
          // Water Level Failsafe: EITHER the level sensor OR float 2 reading full
          // (both OFF) counts as "over level" and must stop ATO top-up / WC fill.
          bool wl_failsafe = (f2role == "Water Level Failsafe" && !id(float_2).state);  // full: OFF = reached
          // ----- DC5: Doser or Cooling Fan -----
          {
            std::string r = id(dc_5_role).current_option();
            if (r == "Cooling Fan") {
              if (id(cool_on)) id(dc_out5).turn_on(); else id(dc_out5).turn_off();
            } else if (r == "Doser") {
              if (time_ok) {
                auto dt = id(dose_time_5).state_as_esptime();
                if (now.hour == dt.hour && now.minute == dt.minute && !id(dosed_today_5)) {
                  id(dosed_today_5) = true;
                  id(run_doser)->execute(5);
                }
              }
            }
          }
          // ----- DC6: Doser or CO2 -----
          {
            std::string r = id(dc_6_role).current_option();
            if (r == "CO2") {
              auto on = id(co2_on_time).state_as_esptime();
              auto off = id(co2_off_time).state_as_esptime();
              if (in_window(on.hour, on.minute, off.hour, off.minute)) id(dc_out6).turn_on();
              else id(dc_out6).turn_off();
            } else if (r == "Doser") {
              if (time_ok) {
                auto dt = id(dose_time_6).state_as_esptime();
                if (now.hour == dt.hour && now.minute == dt.minute && !id(dosed_today_6)) {
                  id(dosed_today_6) = true;
                  id(run_doser)->execute(6);
                }
              }
            }
          }
          // ----- DC7 role -----
          // The ATO top-up itself is handled by the dedicated block below (its
          // output depends on Salt Water). Here we only run DC7's dosing schedule,
          // and keep DC7 off when it's in ATO role but the ATO is running on the
          // filling pump (Salt Water off).
          {
            std::string r = id(dc_7_role).current_option();
            if (r == "Doser") {
              if (time_ok) {
                auto dt = id(dose_time_7).state_as_esptime();
                if (now.hour == dt.hour && now.minute == dt.minute && !id(dosed_today_7)) {
                  id(dosed_today_7) = true;
                  id(run_doser)->execute(7);
                }
              }
            } else if (r == "ATO" && !id(salt_water).state) {
              id(dc_out7).turn_off();
            }
          }
          // ----- ATO top-up function -----
          // Salt Water ON:  runs only when DC7 is in ATO role, driving DC7 (fresh
          //   water top-off, keeping salinity stable).
          // Salt Water OFF: runs regardless of DC7 role, driving the Filling Pump.
          // Sensor semantics (fail-safe): water_level ON = dry (top up), OFF/fault
          // = stop. Blocked by water change / leak / failsafe / ATO source empty;
          // needs ATO Enabled or a manual Top Up Now; capped by ATO Max Runtime.
          {
            bool saltwater = id(salt_water).state;
            bool run_ato = saltwater ? (id(dc_7_role).current_option() == "ATO") : true;
            int areason = 0;              // 0 = topping up
            if (!run_ato) {
              areason = 1;                // DC7 not in ATO role (salt water mode)
            } else {
              esphome::switch_::Switch *ato_out = saltwater
                  ? (esphome::switch_::Switch*) id(dc_out7)
                  : (esphome::switch_::Switch*) id(dc_out2);
              bool needs_water = id(water_level).state;
              float maxrt = id(ato_max_runtime).state;
              bool allowed = id(ato_enable).state || id(ato_topup_now);
              if (id(wc_active))      areason = 2;
              else if (leak)          areason = 3;
              else if (wl_failsafe)   areason = 4;
              else if (ato_empty)     areason = 5;
              else if (id(ato_paused)) areason = 6;
              if (areason != 0) {
                ato_out->turn_off();        // blocked
                id(ato_runtime) = 0;
                id(ato_topup_now) = false;  // cancel any manual request while blocked
              } else if (!needs_water) {
                areason = 7;                // tank full
                ato_out->turn_off();
                id(ato_runtime) = 0;
                id(ato_topup_now) = false;  // manual request satisfied
              } else if (!allowed) {
                areason = 8;                // ATO disabled and no manual request
                ato_out->turn_off();
              } else if (id(ato_runtime) >= maxrt) {
                areason = 9;                // safety cap hit
                ato_out->turn_off();
                id(ato_topup_now) = false;
              } else {
                ato_out->turn_on();
                id(ato_runtime) += 1;       // interval is 1s
              }
            }
            // Log the reason only when it changes (the loop runs every second).
            if (areason != id(ato_reason)) {
              id(ato_reason) = areason;
              switch (areason) {
                case 0: ESP_LOGI("ato", "Topping up"); break;
                case 1: ESP_LOGI("ato", "Idle: DC7 not in ATO role"); break;
                case 2: ESP_LOGW("ato", "Blocked: water change active"); break;
                case 3: ESP_LOGW("ato", "Blocked: leak detected"); break;
                case 4: ESP_LOGW("ato", "Blocked: water level failsafe (float 2 at level)"); break;
                case 5: ESP_LOGW("ato", "Blocked: ATO source empty (float 1)"); break;
                case 6: ESP_LOGW("ato", "Stopped by user (ATO: Stop)"); break;
                case 7: ESP_LOGI("ato", "Idle: tank full"); break;
                case 8: ESP_LOGI("ato", "Idle: ATO disabled"); break;
                case 9: ESP_LOGW("ato", "Stopped: max runtime reached — press Top Up Now or Cancel to reset"); break;
              }
            }
          }
          // ----- DC8: Doser or Solenoid -----
          {
            std::string r = id(dc_8_role).current_option();
            if (r == "ATO Fill") {
              // Solenoid closed unless a scheduled ATO run is active (driven below).
              if (!id(as_active)) id(dc_out8).turn_off();
            } else if (r == "Doser") {
              if (time_ok) {
                auto dt = id(dose_time_8).state_as_esptime();
                if (now.hour == dt.hour && now.minute == dt.minute && !id(dosed_today_8)) {
                  id(dosed_today_8) = true;
                  id(run_doser)->execute(8);
                }
              }
            }
          }
          // ----- Fixed doser DC3 -----
          if (time_ok) {
            auto dt = id(dose_time_3).state_as_esptime();
            if (now.hour == dt.hour && now.minute == dt.minute && !id(dosed_today_3)) {
              id(dosed_today_3) = true;
              id(run_doser)->execute(3);
            }
          }
          // ----- DC4: Doser or Refill Solenoid -----
          {
            std::string r4 = id(dc_4_role).current_option();
            if (r4 == "Doser") {
              if (time_ok) {
                auto dt = id(dose_time_4).state_as_esptime();
                if (now.hour == dt.hour && now.minute == dt.minute && !id(dosed_today_4)) {
                  id(dosed_today_4) = true;
                  id(run_doser)->execute(4);
                }
              }
            } else if (r4 == "Refill Solenoid") {
              // Solenoid closed unless a reservoir fill is running (driven below).
              if (!id(rf_active)) id(dc_out4).turn_off();
            }
          }
          // ===== Scheduled water change =====
          // Fires once/day when enabled, today's day switch is on, and the
          // clock matches wc_time. day_of_week: 1=Sun .. 7=Sat.
          if (time_ok && id(wc_enable).state && !id(wc_done_today)) {
            auto wct = id(wc_time).state_as_esptime();
            bool day_on = false;
            switch (now.day_of_week) {
              case 1: day_on = id(wc_sun).state; break;
              case 2: day_on = id(wc_mon).state; break;
              case 3: day_on = id(wc_tue).state; break;
              case 4: day_on = id(wc_wed).state; break;
              case 5: day_on = id(wc_thu).state; break;
              case 6: day_on = id(wc_fri).state; break;
              case 7: day_on = id(wc_sat).state; break;
            }
            if (day_on && now.hour == wct.hour && now.minute == wct.minute) {
              id(wc_done_today) = true;
              id(wc_begin)->execute();
              ESP_LOGI("wc", "Scheduled water change triggered");
            }
          }
          // ===== Water change state machine (runs every 1s tick) =====
          // Drain and fill are tracked separately so they can overlap in
          // simultaneous mode. All progress is in persisted globals, so Stop
          // (pause), Continue, and reboot-resume all work. Elapsed counters are
          // in seconds because this loop ticks at 1s.
          if (id(wc_active)) {
            float Dwc = id(wc_drain_seconds).state;
            float Rwc = id(wc_fill_ratio).state;
            float maxfill = Rwc * Dwc * ((Rwc < 1.0f) ? 1.0f : 1.1f);
            bool sim = id(wc_simultaneous).state;
            // Auto-stop conditions — each pauses the change (resumable via
            // Continue once cleared), same effect as pressing Stop.
            if (!id(wc_paused)) {
              if (leak) {
                id(wc_paused) = true;
                ESP_LOGW("wc", "Water change stopped: leak detected");
              } else if (reservoir_empty) {
                id(wc_paused) = true;
                ESP_LOGW("wc", "Water change stopped: reservoir empty (float 1)");
              } else if (drainage_full) {
                id(wc_paused) = true;
                ESP_LOGW("wc", "Water change stopped: drainage container full (float 2)");
              }
            }
            if (id(wc_paused)) {
              id(dc_out1).turn_off();
              id(dc_out2).turn_off();
            } else {
              // ----- Drain track (timed) -----
              if (!id(wc_drain_done)) {
                id(dc_out1).turn_on();
                id(wc_drain_elapsed) += 1;
                if (id(wc_drain_elapsed) >= Dwc) {
                  id(dc_out1).turn_off();
                  id(wc_drain_done) = true;
                  ESP_LOGI("wc", "Drain complete");
                }
              } else {
                id(dc_out1).turn_off();
              }
              // ----- Fill track -----
              if (!id(wc_fill_done)) {
                if (!id(wc_fill_started)) {
                  bool startfill = false;
                  if (sim) {
                    // Wait for the level sensor to clear (drop below normal =>
                    // water_level ON/dry), then delay before filling.
                    if (!id(wc_clear_seen)) {
                      if (id(water_level).state == true) {
                        id(wc_clear_seen) = true;
                      } else if (id(wc_drain_done)) {
                        // Drain finished but the level never cleared. Fill anyway
                        // rather than leaving the tank drained. The level sensor
                        // already reads full so it can't be the stop condition —
                        // the Water Level Failsafe (if that role is selected) and
                        // the max fill time bound this fill instead.
                        id(wc_clear_seen)   = true;
                        id(wc_fill_force)   = true;
                        id(wc_fill_started) = true;
                        id(wc_fill_elapsed) = 0;
                        ESP_LOGW("wc", "Level never cleared — filling anyway (failsafe + max time only)");
                      }
                    } else {
                      // ratio > 1 (fill slower than drain): start almost at once so
                      //   the slow fill overlaps the drain as much as possible.
                      // ratio <= 1 (fill faster): hold off by D*(1-R) so the fill
                      //   reaches the sensor about when the drain finishes.
                      float delayS = (Rwc > 1.0f) ? 10.0f : (Dwc * (1.0f - Rwc));
                      if (id(wc_delay_elapsed) == 0)
                        ESP_LOGI("wc", "Level cleared — waiting %d s before filling", (int) delayS);
                      id(wc_delay_elapsed) += 1;
                      if (id(wc_delay_elapsed) >= delayS) startfill = true;
                    }
                  } else {
                    // Sequential: fill only after draining finishes.
                    if (id(wc_drain_done)) startfill = true;
                  }
                  if (startfill) {
                    id(wc_fill_started) = true;
                    id(wc_fill_elapsed) = 0;
                    ESP_LOGI("wc", "Filling");
                  }
                }
                if (id(wc_fill_started) && !id(wc_fill_done)) {
                  id(dc_out2).turn_on();
                  id(wc_fill_elapsed) += 1;
                  // End of fill = level reads wet again (water_level OFF), the
                  // high-level failsafe (float 2) trips, or the max fill cap.
                  // The level sensor is only ignored on a fallback fill (the
                  // level never cleared, so the sensor already reads full and
                  // can't be a meaningful stop) — that fill runs on time alone,
                  // still bounded by the failsafe and the max fill time.
                  if ((!id(wc_fill_force) && id(water_level).state == false)
                      || wl_failsafe || id(wc_fill_elapsed) >= maxfill) {
                    id(dc_out2).turn_off();
                    id(wc_fill_done) = true;
                    ESP_LOGI("wc", "Fill complete");
                  }
                }
              } else {
                id(dc_out2).turn_off();
              }
              // ----- Completion -----
              if (id(wc_drain_done) && id(wc_fill_done)) {
                id(dc_out1).turn_off();
                id(dc_out2).turn_off();
                id(wc_active)        = false;
                id(wc_paused)        = false;
                id(wc_drain_done)    = false;
                id(wc_fill_started)  = false;
                id(wc_fill_done)     = false;
                id(wc_clear_seen)    = false;
                id(wc_fill_force)    = false;
                id(wc_drain_elapsed) = 0;
                id(wc_fill_elapsed)  = 0;
                id(wc_delay_elapsed) = 0;
                ESP_LOGI("wc", "Water change complete");
              }
            }
          }
          // ===== Scheduled reservoir fill trigger =====
          // Every day at rf_time when enabled. rf_begin enforces prerequisites.
          if (time_ok && id(rf_enable).state && !id(rf_done_today)) {
            auto rft = id(rf_time).state_as_esptime();
            if (now.hour == rft.hour && now.minute == rft.minute) {
              id(rf_done_today) = true;
              id(rf_begin)->execute();
              ESP_LOGI("rf", "Scheduled reservoir fill triggered");
            }
          }
          // ===== Reservoir fill state machine (1s tick) =====
          // Runs DC4 (Refill Solenoid) until the reservoir reads full (Float 2 in
          // "Reservoir Full" role, OFF = full) or Reservoir Fill Max Runtime. A
          // leak pauses it (resumable); a role/config change aborts it.
          if (id(rf_active)) {
            bool rf_ok = (f2role == "Reservoir Full")
                      && (id(dc_4_role).current_option() == "Refill Solenoid");
            if (!rf_ok) {
              id(dc_out4).turn_off();
              id(rf_active) = false;
              id(rf_paused) = false;
              id(rf_elapsed) = 0;
              ESP_LOGW("rf", "Reservoir fill aborted: Float 2 or DC4 role changed");
            } else if (leak && !id(rf_paused)) {
              id(rf_paused) = true;
              id(dc_out4).turn_off();
              ESP_LOGW("rf", "Reservoir fill stopped: leak detected");
            } else if (id(rf_paused)) {
              id(dc_out4).turn_off();
            } else {
              bool reservoir_full = !id(float_2).state;   // Reservoir Full: OFF = full
              float rfmax = id(rf_max_runtime).state;
              if (reservoir_full) {
                id(dc_out4).turn_off();
                id(rf_active) = false;
                id(rf_elapsed) = 0;
                ESP_LOGI("rf", "Reservoir fill complete: reservoir full");
              } else if (id(rf_elapsed) >= rfmax) {
                id(dc_out4).turn_off();
                id(rf_active) = false;
                id(rf_elapsed) = 0;
                ESP_LOGW("rf", "Reservoir fill stopped: max runtime reached");
              } else {
                id(dc_out4).turn_on();
                id(rf_elapsed) += 1;
              }
            }
          }
          // ===== Scheduled ATO fill trigger =====
          // Every day at as_time when enabled. as_begin enforces prerequisites.
          if (time_ok && id(as_enable).state && !id(as_done_today)) {
            auto ast = id(as_time).state_as_esptime();
            if (now.hour == ast.hour && now.minute == ast.minute) {
              id(as_done_today) = true;
              id(as_begin)->execute();
              ESP_LOGI("as", "Scheduled ATO fill triggered");
            }
          }
          // ===== ATO fill state machine (1s tick) =====
          // Requires Float 1 = ATO Full and DC8 = ATO Fill. Opens DC8 until
          // the ATO Full float reads full (OFF), the Water Level Failsafe trips,
          // or ATO Fill Max Runtime. A leak pauses it (resumable); it holds
          // during a water change (auto-resumes); a role change aborts it.
          if (id(as_active)) {
            if (id(dc_8_role).current_option() != "ATO Fill" || f1role != "ATO Full") {
              id(dc_out8).turn_off();
              id(as_active) = false;
              id(as_paused) = false;
              id(as_elapsed) = 0;
              ESP_LOGW("as", "ATO fill aborted: DC8 or Float 1 role changed");
            } else if (leak && !id(as_paused)) {
              id(as_paused) = true;
              id(dc_out8).turn_off();
              ESP_LOGW("as", "ATO fill stopped: leak detected");
            } else if (id(as_paused) || id(wc_active)) {
              // Paused by user/leak, or held during a water change.
              id(dc_out8).turn_off();
            } else {
              // ATO Full float (role): OFF = level reached. Failsafe is an extra cutoff.
              bool ato_full = (id(float_1).state == false) || wl_failsafe;
              float asmax = id(as_max_runtime).state;
              if (ato_full) {
                id(dc_out8).turn_off();
                id(as_active) = false;
                id(as_elapsed) = 0;
                ESP_LOGI("as", "ATO fill complete: ATO Full reached");
              } else if (id(as_elapsed) >= asmax) {
                id(dc_out8).turn_off();
                id(as_active) = false;
                id(as_elapsed) = 0;
                ESP_LOGW("as", "ATO fill stopped: max runtime reached");
              } else {
                id(dc_out8).turn_on();
                id(as_elapsed) += 1;
              }
            }
          }
          // ===== Force selected outputs off during a water change =====
          // Runs last so it overrides the normal AC/DC control above.
          if (id(wc_active)) {
            if (id(ac1_off_wc).state) id(AC_1).turn_off();
            if (id(ac2_off_wc).state) id(AC_2).turn_off();
            if (id(ac3_off_wc).state) id(AC_3).turn_off();
            if (id(ac4_off_wc).state) id(AC_4).turn_off();
            if (id(dc6_off_wc).state) id(dc_out6).turn_off();
            if (id(dc8_off_wc).state) id(dc_out8).turn_off();
          }
