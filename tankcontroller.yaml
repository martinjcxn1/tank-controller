substitutions:
  name: tankcontroller
  friendly_name: "Tank Controller"
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Firmware version. On a release build, CI overwrites the value below with a
  # generated UTC timestamp (e.g. 2026.08.05.1430) BEFORE compiling, then stamps
  # that same value into manifest.json — so the version baked into the binary and
  # the version advertised to devices always match. Leave the sentinel as-is; it
  # only shows on local dev builds. Do not hand-edit it for releases.
  project:
    name: "martinjcxn.tank-controller"
    version: "0.0.0-dev"   # CI-INJECTED: replaced at build time, do not edit
  on_boot:
    # All pumps/solenoids off at boot. ONLY the water change survives a reboot:
    # it's the one process that can leave the tank drained, so it restores in a
    # paused state and is resumed with "Water Change: Continue". Reservoir fill,
    # ATO fill and the ATO top-up are all non-restoring — a reboot simply
    # clears them, so nothing can come back latched or stuck.
    priority: -100
    then:
      - lambda: |-
          id(dc_out1).turn_off();
          id(dc_out2).turn_off();
          id(dc_out4).turn_off();
          id(dc_out7).turn_off();
          id(dc_out8).turn_off();
          if (id(wc_active)) {
            id(wc_paused) = true;
            ESP_LOGW("wc", "Reboot during a water change — paused. Press Continue to resume.");
          }
          // Publish the running firmware version once (sensor is update_interval: never).
          id(fw_version).publish_state(ESPHOME_PROJECT_VERSION);
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      # HTTPS to GitHub needs a big contiguous TLS allocation. This device runs
      # a lot (3× MCP expanders, HX711, web_server v3), so free heap is tight and
      # the handshake can fail with "HTTP_CLIENT: Out of buffer" even when the
      # request buffers are large enough. These free the mbedTLS RX/TX buffers
      # when idle and size them to the negotiated length, reclaiming ~20KB+.
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT: y
      CONFIG_MBEDTLS_SSL_VARIABLE_BUFFER_LENGTH: y
logger:
  level: INFO
api:
  # Default is reboot_timeout: 15min — the device reboots if no API client
  # (Home Assistant) ever connects. This unit runs standalone off its web
  # interface, so that watchdog must be disabled or it reboots every 15 min.
  reboot_timeout: 0s
ota:
  - platform: esphome
  - platform: web_server
  # Lets the device pull a compiled binary from a URL and self-flash. This is
  # what the owner-triggered "Install Firmware Update" button uses.
  - platform: http_request
# Required by the http_request OTA/update platforms above.
http_request:
  # GitHub's releases/latest/download URL 302-redirects to a very long signed
  # objects.githubusercontent.com URL. When the client then SENDS the GET for
  # that redirected URL, the ~700-char request line overflows the default
  # 512-byte transmit buffer — that's the "HTTP_CLIENT: Out of buffer" /
  # esp_http_client_open ESP_FAIL seen when fetching the manifest (ESPHome
  # issue #13786). buffer_size_tx is the one that matters here; rx is bumped
  # too to hold the redirect's response headers.
  buffer_size_tx: 2048
  buffer_size_rx: 2048
  timeout: 15s
  # Skips X.509 certificate-chain verification. That verification is the single
  # biggest peak-memory cost of the TLS handshake, and on this heavily-loaded
  # board the handshake was failing for lack of contiguous heap ("Out of
  # buffer"). Trade-off: the update channel is no longer authenticated, so it
  # relies on GitHub serving the right binary rather than proving it. For a
  # productised unit, prefer restoring verification once heap headroom is sorted
  # (e.g. GitHub Pages hosting + trimming RAM) — see RELEASING.md.
  verify_ssl: false
# Self-update entity. Polls the GitHub Release manifest, compares its running
# version against the manifest "version", and exposes an update entity in
# web_server/HA. Installing is owner-gated by the button further below — it is
# NOT set to auto-install.
update:
  - platform: http_request
    name: "Firmware Update"
    id: fw_update
    source: https://github.com/martinjcxn1/tank-controller/releases/latest/download/manifest.json
    update_interval: 6h
    web_server:
      sorting_group_id: grp_firmware
      sorting_weight: 20
wifi:
  # No hard-coded network: boots straight into AP mode so WiFi can be selected
  # via the captive portal. Credentials entered there are stored in flash and
  # used on subsequent boots.
  # Default is reboot_timeout: 15min — reboots when not joined to a network.
  # That would restart the unit every 15 min while it sits in AP mode, so it is
  # disabled here; the controller must keep running standalone regardless.
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name}"
    password: "tankcontroller"
# Serves the WiFi network-selection / provisioning page when in AP/fallback mode.
captive_portal:
mdns:
  disabled: false
web_server:
  version: 3
  sorting_groups:
