  # ---- Water change manual controls ----
  - platform: template
    name: "Water Change: Start Now"
    web_server: {sorting_group_id: grp_wc_settings, sorting_weight: 80}
    on_press:
      - script.execute: wc_begin
  # Stop = pause: freeze the change (pumps off) but keep all progress so it can
  # be resumed. A leak detection presses this automatically (see 1s loop).
  - platform: template
    name: "Water Change: Stop"
    web_server: {sorting_group_id: grp_wc_settings, sorting_weight: 81}
    on_press:
      - lambda: |-
          if (id(wc_active)) {
            id(wc_paused) = true;
            id(dc_out1).turn_off();
            id(dc_out2).turn_off();
            ESP_LOGW("wc", "Water change stopped (paused) by user");
          } else {
            ESP_LOGI("wc", "Stop ignored: no change in progress");
          }
  # Continue = resume a stopped change from where it left off. Refused if a leak
  # is still present.
  - platform: template
    name: "Water Change: Continue"
    web_server: {sorting_group_id: grp_wc_settings, sorting_weight: 82}
    on_press:
      - lambda: |-
          if (!id(wc_active)) { ESP_LOGI("wc", "Continue ignored: no change in progress"); return; }
          if (!id(wc_paused)) { ESP_LOGI("wc", "Continue ignored: change not stopped"); return; }
          if (id(leak_sensor).state) { ESP_LOGW("wc", "Continue refused: leak still present"); return; }
          id(wc_paused) = false;
          ESP_LOGI("wc", "Water change resumed");
  # Fill Only / Drain Only: run just one leg of the water change through the same
  # state machine, so the WC Stop / Continue / Cancel buttons work with them too.
  - platform: template
    name: "Water Change: Fill Only"
    web_server: {sorting_group_id: grp_wc_settings, sorting_weight: 83}
    on_press:
      - lambda: |-
          if (id(leak_sensor).state) { ESP_LOGW("wc", "Fill Only refused: leak detected"); return; }
          if (id(wc_active) && !id(wc_paused)) { ESP_LOGW("wc", "Fill Only ignored: change already running"); return; }
          id(wc_drain_elapsed) = 0; id(wc_fill_elapsed) = 0; id(wc_delay_elapsed) = 0;
          id(wc_drain_done)   = true;    // skip drain
          id(wc_clear_seen)   = true;
          id(wc_fill_force)   = false;
          id(wc_fill_started) = true;    // start filling immediately
          id(wc_fill_done)    = false;
          id(wc_paused)       = false;
          id(wc_active)       = true;
          ESP_LOGI("wc", "Water change: fill only started");
  - platform: template
    name: "Water Change: Drain Only"
    web_server: {sorting_group_id: grp_wc_settings, sorting_weight: 84}
    on_press:
      - lambda: |-
          if (id(leak_sensor).state) { ESP_LOGW("wc", "Drain Only refused: leak detected"); return; }
          if (id(wc_active) && !id(wc_paused)) { ESP_LOGW("wc", "Drain Only ignored: change already running"); return; }
          id(wc_drain_elapsed) = 0; id(wc_fill_elapsed) = 0; id(wc_delay_elapsed) = 0;
          id(wc_drain_done)   = false;   // run drain
          id(wc_clear_seen)   = false;
          id(wc_fill_force)   = false;
          id(wc_fill_started) = false;
          id(wc_fill_done)    = true;    // skip fill
          id(wc_paused)       = false;
          id(wc_active)       = true;
          ESP_LOGI("wc", "Water change: drain only started");
  # Cancel = clear all water-change state (both pumps off) so it can be restarted.
  - platform: template
    name: "Water Change: Cancel"
    web_server: {sorting_group_id: grp_wc_settings, sorting_weight: 85}
    on_press:
      - lambda: |-
          id(wc_active) = false; id(wc_paused) = false;
          id(wc_drain_done) = false; id(wc_fill_started) = false; id(wc_fill_done) = false;
          id(wc_clear_seen) = false; id(wc_fill_force) = false;
          id(wc_drain_elapsed) = 0; id(wc_fill_elapsed) = 0; id(wc_delay_elapsed) = 0;
          id(dc_out1).turn_off(); id(dc_out2).turn_off();
          ESP_LOGW("wc", "Water change cancelled/cleared");
  # ---- Reservoir fill manual controls ----
