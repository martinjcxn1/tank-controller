i2c:
  scl: GPIO22
  sda: GPIO21
  # Back to 100kHz: the bus is electrically marginal (BSS138 level-shifter gate
  # fault puts ~3.5V on SDA/SCL) and faster edges provoke lockups. The button
  # polling that motivated 400kHz is gone now anyway.
  # scan disabled: probing every address at boot can stall on a flaky bus.
  scan: false
  frequency: 100kHz
mcp23008:
  - id: control_12v
    address: 0x20
# ---- Lid button / LED expanders disabled (hardware not required) ----
# The MCP23008 'control_12v' above stays: it drives DC outputs 1-8.
#mcp23017:
#  - id: lid_buttons
#    address: 0x22
#  - id: lid_leds
#    address: 0x23
one_wire:
  - platform: gpio
    pin: GPIO4
time:
  - platform: sntp
    id: sntp_time
    timezone: Africa/Johannesburg
    servers:
      - 0.za.pool.ntp.org
      - pool.ntp.org
    on_time:
      # Midnight reset of all "dosed today" flags
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(dosed_today_3) = false;
              id(dosed_today_4) = false;
              id(dosed_today_5) = false;
              id(dosed_today_6) = false;
              id(dosed_today_7) = false;
              id(dosed_today_8) = false;
              id(wc_done_today) = false;
              id(rf_done_today) = false;
              id(as_done_today) = false;
    # Whenever SNTP gets a fresh network time, push it into the battery-backed RTC.
    on_time_sync:
      then:
        - ds1307.write_time:
            id: ds3231_time
  # Battery-backed RTC (DS3231 @ 0x68, driven by the register-compatible ds1307
  # platform). Seeds system time at boot when offline and re-reads periodically,
  # keeping scheduling/dosing/midnight-reset working without WiFi/SNTP. SNTP
  # overwrites it whenever the network is available.
  - platform: ds1307
    id: ds3231_time
    update_interval: 15min
  - platform: homeassistant
    id: hass_time
globals:
  - id: hx_offset
    type: float
    restore_value: true
    initial_value: '50535'
  - id: hx_scale
    type: float
    restore_value: true
    initial_value: '215.42'
  # ATO runtime tracking (seconds the ATO output has been running this cycle)
  - id: ato_runtime
    type: float
    restore_value: false
    initial_value: '0'
  # Manual "Top Up Now" request (one-shot, cleared when full/capped/blocked)
  - id: ato_topup_now
    type: bool
    restore_value: false
    initial_value: 'false'
  # ATO paused by the ATO Stop button (resumable via ATO Continue)
  - id: ato_paused
    type: bool
    restore_value: false
    initial_value: 'false'
  # Why the ATO is doing what it's doing. Logged (and shown in ATO Status) only
  # when it CHANGES, so the log isn't flooded by the 1s loop. -1 = not yet set.
  - id: ato_reason
    type: int
    restore_value: false
    initial_value: '-1'
  # Thermostat heat/cool demand (hysteresis state, recomputed each tick)
  - id: heat_on
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cool_on
    type: bool
    restore_value: false
    initial_value: 'false'
  # Water-change state machine (persisted so a change survives a reboot and can
  # be stopped/continued). wc_active = a change is in progress (incl. paused).
  - id: wc_active
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: wc_paused
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: wc_drain_done
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: wc_fill_started
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: wc_fill_done
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: wc_clear_seen
    type: bool
    restore_value: true
    initial_value: 'false'
  # Set when a fill must ignore the level sensor as its stop condition (fallback
  # fill after the level never cleared). Fill is then bounded only by the Water
  # Level Failsafe and the max fill time.
  - id: wc_fill_force
    type: bool
    restore_value: true
    initial_value: 'false'
  # NOTE: elapsed counters are deliberately NOT restored. They change every
  # second, and a restoring global is written to NVS flash on every change —
  # that caused per-second flash writes (stalls + wear). On reboot the phase
  # flags below still restore, so a run resumes at the start of its phase.
  - id: wc_drain_elapsed
    type: float
    restore_value: false
    initial_value: '0'
  - id: wc_fill_elapsed
    type: float
    restore_value: false
    initial_value: '0'
  - id: wc_delay_elapsed
    type: float
    restore_value: false
    initial_value: '0'
  - id: wc_done_today
    type: bool
    restore_value: false
    initial_value: 'false'
  # Scheduled reservoir fill state (persisted for stop/continue/reboot)
  - id: rf_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rf_paused
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rf_elapsed
    type: float
    restore_value: false
    initial_value: '0'
  - id: rf_done_today
    type: bool
    restore_value: false
    initial_value: 'false'
  # Scheduled ATO fill state (persisted for stop/continue/reboot)
  - id: as_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: as_paused
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: as_elapsed
    type: float
    restore_value: false
    initial_value: '0'
  - id: as_done_today
    type: bool
    restore_value: false
    initial_value: 'false'
  # Per-doser "already dosed today" flags
  - id: dosed_today_3
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: dosed_today_4
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: dosed_today_5
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: dosed_today_6
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: dosed_today_7
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: dosed_today_8
    type: bool
    restore_value: false
    initial_value: 'false'
number:
  - platform: template
    id: ato_max_runtime
    name: "ATO Max Runtime"
    web_server: {sorting_group_id: grp_ato, sorting_weight: 30}
    optimistic: true
    restore_value: true
    initial_value: 120
    min_value: 5
    max_value: 600
    step: 5
    unit_of_measurement: s
    mode: box
