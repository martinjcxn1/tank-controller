button:
  # Owner-triggered firmware update. Re-checks the GitHub Release manifest, then
  # installs only if a newer version is advertised — a press on the latest
  # firmware is a safe no-op. The device reboots into the new image on success.
  - platform: template
    name: "Install Firmware Update"
    id: btn_fw_install
    icon: "mdi:cloud-download"
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 30}
    on_press:
      # Block the install (and its reboot) while a process is mid-cycle that a
      # reboot would corrupt: a water change, or an actual dose. Dual-role
      # outputs 5–8 only count as dosing when they're in "Doser" role — a
      # running cooling fan / CO2 / ATO / solenoid does not block, since those
      # are non-restoring and safe to interrupt.
      - if:
          condition:
            lambda: |-
              if (id(wc_active)) return true;
              if (id(dc_out3).state || id(dc_out4).state) return true;
              if (id(dc_out5).state && id(dc_5_role).current_option() == "Doser") return true;
              if (id(dc_out6).state && id(dc_6_role).current_option() == "Doser") return true;
              if (id(dc_out7).state && id(dc_7_role).current_option() == "Doser") return true;
              if (id(dc_out8).state && id(dc_8_role).current_option() == "Doser") return true;
              return false;
          then:
            - logger.log: "Firmware install blocked — a dose or water change is running. Try again once it finishes."
          else:
            - update.check: fw_update
            - delay: 3s
            - if:
                condition:
                  lambda: 'return id(fw_update).state == update::UPDATE_STATE_AVAILABLE;'
                then:
                  - logger.log: "Owner requested firmware install — updating."
                  - update.perform: {id: fw_update}
                else:
                  - logger.log: "No firmware update available (already up to date)."
  - platform: template
    name: "CO2 Cal: Tare (Zero)"
    web_server: {sorting_group_id: grp_calibration, sorting_weight: 30}
    on_press:
      - lambda: |-
          id(hx_offset) = id(co2_raw).state;
          ESP_LOGI("cal", "Tare set. offset=%.1f", id(hx_offset));
  - platform: template
    name: "CO2 Cal: Set Scale from Known Weight"
    web_server: {sorting_group_id: grp_calibration, sorting_weight: 40}
    on_press:
      - lambda: |-
          float raw = id(co2_raw).state;
          float w = id(cal_known_weight).state;
          if (!isnan(raw) && w > 0) {
            float new_scale = (raw - id(hx_offset)) / w;
            if (new_scale != 0) {
              id(hx_scale) = new_scale;
              ESP_LOGI("cal", "Scale set. scale=%.3f counts/g", id(hx_scale));
            }
          }
  # Manual dose-now buttons (run the doser's configured volume immediately).
  # Dosers 3 & 4 are always dosers. Dosers 5–8 are dual-role, so their
  # Dose Now button only fires when the output is actually in "Doser" role.
  - platform: template
    name: "Doser 3 Dose Now"
    web_server: {sorting_group_id: grp_doser3, sorting_weight: 40}
    on_press:
      - script.execute: {id: run_doser, sw: 3}
  - platform: template
    name: "Doser 4 Dose Now"
    web_server: {sorting_group_id: grp_doser4, sorting_weight: 40}
    on_press:
      - if:
          condition:
            lambda: 'return id(dc_4_role).current_option() == "Doser";'
          then:
            - script.execute: {id: run_doser, sw: 4}
          else:
            - logger.log: "Doser 4 ignored: output in Refill Solenoid role"
  - platform: template
    name: "Doser 5 Dose Now"
    web_server: {sorting_group_id: grp_doser5, sorting_weight: 40}
    on_press:
      - if:
          condition:
            lambda: 'return id(dc_5_role).current_option() == "Doser";'
          then:
            - script.execute: {id: run_doser, sw: 5}
          else:
            - logger.log: "Doser 5 ignored: output not in Doser role"
  - platform: template
    name: "Doser 6 Dose Now"
    web_server: {sorting_group_id: grp_doser6, sorting_weight: 40}
    on_press:
      - if:
          condition:
            lambda: 'return id(dc_6_role).current_option() == "Doser";'
          then:
            - script.execute: {id: run_doser, sw: 6}
          else:
