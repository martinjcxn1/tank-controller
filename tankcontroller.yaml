          id(as_active) = false; id(as_paused) = false; id(as_elapsed) = 0;
          id(dc_out8).turn_off();
          ESP_LOGW("as", "ATO fill cancelled/cleared");
  # ---- ATO manual top-up ----
  # Runs one top-up cycle even if ATO Enabled is off; stops at full or max
  # runtime, and does nothing if the tank already reads full.
  - platform: template
    name: "ATO: Top Up Now"
    web_server: {sorting_group_id: grp_ato, sorting_weight: 50}
    on_press:
      - lambda: |-
          if (id(salt_water).state && id(dc_7_role).current_option() != "ATO") {
            ESP_LOGI("ato", "Top Up Now ignored: DC7 not in ATO role"); return;
          }
          id(ato_paused) = false;      // a manual top-up clears an ATO pause
          id(ato_runtime) = 0;         // fresh allowance: clears a latched max-runtime cap
          id(ato_topup_now) = true;
          ESP_LOGI("ato", "Manual top-up requested");
  # ATO Stop / Continue: pause / resume the continuous auto top-off.
  - platform: template
    name: "ATO: Stop"
    web_server: {sorting_group_id: grp_ato, sorting_weight: 60}
    on_press:
      - lambda: |-
          id(ato_paused) = true;
          id(ato_topup_now) = false;
          ESP_LOGW("ato", "ATO stopped (paused) by user");
  - platform: template
    name: "ATO: Continue"
    web_server: {sorting_group_id: grp_ato, sorting_weight: 70}
    on_press:
      - lambda: |-
          id(ato_paused) = false;
          id(ato_runtime) = 0;         // fresh allowance: clears a latched max-runtime cap
          ESP_LOGI("ato", "ATO resumed");
  # Cancel = clear all ATO state (pause, pending manual top-up, runtime cap) and
  # switch its output off, so a hung/latched top-up can be restarted cleanly.
  - platform: template
    name: "ATO: Cancel"
    web_server: {sorting_group_id: grp_ato, sorting_weight: 80}
    on_press:
      - lambda: |-
          // Clear the latched runtime cap and any pending manual top-up, and leave
          // the ATO STOPPED (press Continue or Top Up Now to re-enable). Deliberately
          // does no I2C here: the control loop switches the output off on its next
          // tick, and leaving it paused stops it immediately re-arming.
          id(ato_topup_now) = false;
          id(ato_runtime)   = 0;
          id(ato_paused)    = true;
          ESP_LOGW("ato", "ATO cancelled and cleared — press Continue to re-enable");
script:
  # Single parameterised doser script. Computes run time = volume / rate,
  # clamps to 300s, turns the matching output on then schedules its off.
  # FIX #3: each doser schedules its OFF against its OWN switch component
  # with a UNIQUE timeout key, so overlapping doses can't cancel each
  # other's shutoff (previously all used dc_out3 + key "dose_off").
  - id: run_doser
    parameters:
      sw: int
    then:
      - lambda: |-
          float vol = 0, rate = 1;
          switch (sw) {
            case 3: vol = id(dose_ml_3).state; rate = id(dose_rate_3).state; break;
            case 4: vol = id(dose_ml_4).state; rate = id(dose_rate_4).state; break;
            case 5: vol = id(dose_ml_5).state; rate = id(dose_rate_5).state; break;
            case 6: vol = id(dose_ml_6).state; rate = id(dose_rate_6).state; break;
            case 7: vol = id(dose_ml_7).state; rate = id(dose_rate_7).state; break;
            case 8: vol = id(dose_ml_8).state; rate = id(dose_rate_8).state; break;
          }
          if (rate <= 0) rate = 1;
          float secs = vol / rate;
          if (secs > 300) secs = 300;   // hard safety cap
          if (secs <= 0) return;
          ESP_LOGI("dose", "Doser %d: %.1f mL @ %.2f mL/s = %.1fs", sw, vol, rate, secs);
          esphome::switch_::Switch *out = nullptr;
          switch (sw) {
            case 3: out = id(dc_out3); break;
            case 4: out = id(dc_out4); break;
            case 5: out = id(dc_out5); break;
            case 6: out = id(dc_out6); break;
            case 7: out = id(dc_out7); break;
            case 8: out = id(dc_out8); break;
          }
          if (out == nullptr) return;
          out->turn_on();
          auto f = [out]() { out->turn_off(); };
          std::string key = "dose_off_" + std::to_string(sw);
          App.scheduler.set_timeout((Component*)out, key.c_str(), (uint32_t)(secs * 1000), f);
  # Fixed-time doser run for flushing / calibration. Runs the matching output
  # for exactly that doser's own Flush/Cal Seconds (clamped 1–60), then off.
  # Shares the per-output "dose_off_<sw>" timeout key so it and a normal dose
  # can never leave an output stuck on.
  - id: flush_doser
    parameters:
      sw: int
    then:
      - lambda: |-
          float secs = 10;
          switch (sw) {
            case 3: secs = id(flush_seconds_3).state; break;
            case 4: secs = id(flush_seconds_4).state; break;
            case 5: secs = id(flush_seconds_5).state; break;
            case 6: secs = id(flush_seconds_6).state; break;
            case 7: secs = id(flush_seconds_7).state; break;
            case 8: secs = id(flush_seconds_8).state; break;
          }
          if (secs < 1) secs = 1;
          if (secs > 60) secs = 60;
          esphome::switch_::Switch *out = nullptr;
          switch (sw) {
            case 3: out = id(dc_out3); break;
            case 4: out = id(dc_out4); break;
            case 5: out = id(dc_out5); break;
            case 6: out = id(dc_out6); break;
            case 7: out = id(dc_out7); break;
            case 8: out = id(dc_out8); break;
          }
          if (out == nullptr) return;
          ESP_LOGI("flush", "Doser %d: fixed run %.0fs", sw, secs);
          out->turn_on();
          auto f = [out]() { out->turn_off(); };
          std::string key = "dose_off_" + std::to_string(sw);
          App.scheduler.set_timeout((Component*)out, key.c_str(), (uint32_t)(secs * 1000), f);
  # Manual stop: cancel the pending off-timer and turn the output off now.
  - id: stop_doser
    parameters:
      sw: int
    then:
      - lambda: |-
          esphome::switch_::Switch *out = nullptr;
          switch (sw) {
            case 3: out = id(dc_out3); break;
            case 4: out = id(dc_out4); break;
            case 5: out = id(dc_out5); break;
            case 6: out = id(dc_out6); break;
            case 7: out = id(dc_out7); break;
            case 8: out = id(dc_out8); break;
          }
          if (out == nullptr) return;
          std::string key = "dose_off_" + std::to_string(sw);
          App.scheduler.cancel_timeout((Component*)out, key.c_str());
          out->turn_off();
          ESP_LOGI("dose", "Doser %d stopped manually", sw);
  # ===== Water change: begin a run =====
  # The actual drain/fill sequencing lives in the 1s control loop (a persisted
  # state machine) so it can be stopped, continued, and survive a reboot. This
  # script just (re)initialises the state and arms it. Refused on an active leak.
  - id: wc_begin
    then:
      - lambda: |-
          if (id(leak_sensor).state) { ESP_LOGW("wc", "Start refused: leak detected"); return; }
          if (id(wc_active) && !id(wc_paused)) { ESP_LOGW("wc", "Start ignored: already running"); return; }
          id(wc_drain_elapsed) = 0;
          id(wc_fill_elapsed)  = 0;
          id(wc_delay_elapsed) = 0;
          id(wc_drain_done)    = false;
          id(wc_fill_started)  = false;
          id(wc_fill_done)     = false;
          id(wc_clear_seen)    = false;
          id(wc_fill_force)    = false;
          id(wc_paused)        = false;
          id(wc_active)        = true;
          ESP_LOGI("wc", "Water change started");
  # ===== Reservoir fill: begin a run =====
  # Refused unless the prerequisites hold: Float 2 = Reservoir Full, DC4 = Refill
  # Solenoid, and no leak. The 1s loop runs the solenoid until the reservoir
  # reads full or Reservoir Fill Max Runtime is hit.
  - id: rf_begin
    then:
      - lambda: |-
          if (id(float_2_role).current_option() != "Reservoir Full") {
            ESP_LOGW("rf", "Start refused: Float 2 is not set to Reservoir Full"); return;
          }
          if (id(dc_4_role).current_option() != "Refill Solenoid") {
            ESP_LOGW("rf", "Start refused: DC4 is not set to Refill Solenoid"); return;
          }
          if (id(leak_sensor).state) {
            ESP_LOGW("rf", "Start refused: leak detected"); return;
          }
          if (id(rf_active) && !id(rf_paused)) {
            ESP_LOGW("rf", "Start ignored: reservoir fill already running"); return;
          }
          id(rf_elapsed) = 0;
          id(rf_paused)  = false;
          id(rf_active)  = true;
          ESP_LOGI("rf", "Reservoir fill started");
  # ===== ATO fill: begin a run =====
  # Refused unless DC8 = ATO Fill and no leak. The 1s loop opens the solenoid
  # until the tank reads full (level sensor) or ATO Fill Max Runtime.
  - id: as_begin
    then:
      - lambda: |-
          if (id(dc_8_role).current_option() != "ATO Fill") {
            ESP_LOGW("as", "Start refused: DC8 is not set to ATO Fill"); return;
          }
          if (id(float_1_role).current_option() != "ATO Full") {
            ESP_LOGW("as", "Start refused: Float 1 is not set to ATO Full"); return;
          }
          if (id(leak_sensor).state) {
            ESP_LOGW("as", "Start refused: leak detected"); return;
          }
          if (id(as_active) && !id(as_paused)) {
            ESP_LOGW("as", "Start ignored: ATO fill already running"); return;
          }
          id(as_elapsed) = 0;
          id(as_paused)  = false;
          id(as_active)  = true;
          ESP_LOGI("as", "ATO fill started");
