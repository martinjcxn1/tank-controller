          if (!id(as_active)) { ESP_LOGI("as", "Continue ignored: no ATO fill in progress"); return; }
          if (!id(as_paused)) { ESP_LOGI("as", "Continue ignored: not stopped"); return; }
          if (id(leak_sensor).state) { ESP_LOGW("as", "Continue refused: leak still present"); return; }
          id(as_paused) = false;
          ESP_LOGI("as", "ATO fill resumed");
  # Cancel = clear all ATO-solenoid state (solenoid off) so it can be restarted.
  - platform: template
